name: Build and publish test Docker image

on:
  push:
    tags:
      - 'v*-test'

jobs:
  build-and-push:
    name: Build and push test Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "channel=test" >> $GITHUB_OUTPUT
          echo "tags=roninriddle/fnos-extractor:$VERSION,roninriddle/fnos-extractor:test" >> $GITHUB_OUTPUT

      - name: Show publish plan
        run: |
          echo "Ref: $GITHUB_REF"
          echo "Channel: ${{ steps.meta.outputs.channel }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
