name: Build and publish Docker image

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    if: ${{ !endsWith(github.ref_name, '-test') }}
    name: Build and push release Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "channel=release" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tags=roninriddle/fnos-extractor:$VERSION,roninriddle/fnos-extractor:latest" >> $GITHUB_OUTPUT

      - name: Show publish plan
        run: |
          echo "Ref: $GITHUB_REF"
          echo "Channel: ${{ steps.meta.outputs.channel }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}

      - name: Cleanup old DockerHub tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          KEEP_TAGS: "1.2.96,${{ steps.meta.outputs.version }},latest"
        run: |
          set -euo pipefail

          AUTH_RESPONSE=$(curl -fsSL -H "Content-Type: application/json" \
            -X POST \
            -d "{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}" \
            https://hub.docker.com/v2/users/login/)
          JWT_TOKEN=$(echo "$AUTH_RESPONSE" | jq -r '.token')

          if [[ -z "$JWT_TOKEN" || "$JWT_TOKEN" == "null" ]]; then
            echo "Failed to acquire DockerHub token"
            exit 1
          fi

          KEEP_REGEX="^($(echo "$KEEP_TAGS" | tr ',' '|'))$"
          NEXT_URL="https://hub.docker.com/v2/repositories/roninriddle/fnos-extractor/tags?page_size=100"
          TAGS_TO_DELETE_FILE=$(mktemp)
          trap 'rm -f "$TAGS_TO_DELETE_FILE"' EXIT

          while [[ -n "$NEXT_URL" && "$NEXT_URL" != "null" ]]; do
            PAGE=$(curl -fsSL -H "Authorization: JWT $JWT_TOKEN" "$NEXT_URL")
            while IFS= read -r TAG_NAME; do
              [[ -z "$TAG_NAME" ]] && continue
              if [[ ! "$TAG_NAME" =~ $KEEP_REGEX ]]; then
                echo "$TAG_NAME" >> "$TAGS_TO_DELETE_FILE"
              fi
            done < <(echo "$PAGE" | jq -r '.results[]?.name')
            NEXT_URL=$(echo "$PAGE" | jq -r '.next // empty')
          done

          sort -u "$TAGS_TO_DELETE_FILE" -o "$TAGS_TO_DELETE_FILE"

          if [[ ! -s "$TAGS_TO_DELETE_FILE" ]]; then
            echo "No old DockerHub tags to delete"
            exit 0
          fi

          while IFS= read -r TAG_NAME; do
            [[ -z "$TAG_NAME" ]] && continue
            echo "Deleting DockerHub tag: $TAG_NAME"
            DELETE_RESPONSE_FILE=$(mktemp)
            DELETE_STATUS=$(curl -sSL -o "$DELETE_RESPONSE_FILE" -w "%{http_code}" \
              -X DELETE \
              -H "Authorization: JWT $JWT_TOKEN" \
              "https://hub.docker.com/v2/repositories/roninriddle/fnos-extractor/tags/$TAG_NAME/")

            if [[ "$DELETE_STATUS" == "202" || "$DELETE_STATUS" == "204" || "$DELETE_STATUS" == "404" ]]; then
              echo "Delete status for $TAG_NAME: $DELETE_STATUS"
            else
              echo "Failed to delete DockerHub tag: $TAG_NAME (HTTP $DELETE_STATUS)"
              cat "$DELETE_RESPONSE_FILE"
              rm -f "$DELETE_RESPONSE_FILE"
              exit 1
            fi

            rm -f "$DELETE_RESPONSE_FILE"
          done < "$TAGS_TO_DELETE_FILE"
