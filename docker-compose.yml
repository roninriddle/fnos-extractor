services:
  fnos-extractor:
    image: roninriddle/fnos-extractor:latest
    # 如需固定架构可取消注释并设置：linux/arm64 或 linux/amd64
    # platform: linux/arm64
    # 如需本地构建请启用下面一行
    # build: .
    container_name: fnos-extractor
    ports:
      - "${FNOS_BIND_ADDRESS:-127.0.0.1}:5000:5000"
    volumes:
      # 挂载下载目录
      - /vol1/1000/Temp:/temp
      # 加密密码数据和日志
      - ./data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - TZ=Asia/Shanghai
      - APP_TIMEZONE=Asia/Shanghai
      - FNOS_MOUNT_PATH=/temp
      - FNOS_DATA_DIR=/data
      - FNOS_LOG_FILE=/data/fnos.log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

# 使用方法:
# docker compose up -d
# 然后访问 http://localhost:5000
